name: Generate project documentation

on:
  push:
    paths-ignore:
      - PROJECT_DOCUMENTATION.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate documentation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/github-project-docs.js --repo "${{ github.repository }}" --ref "${{ github.sha }}" --output PROJECT_DOCUMENTATION.md

      - name: Commit documentation when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_DOCUMENTATION.md
          git diff --cached --quiet || git commit -m "docs: update project documentation"
          git push